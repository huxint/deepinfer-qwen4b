[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepinfer"
version = "0.1.0"
description = "A minimal Qwen3.5 inference framework"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["torch==2.10.0", "transformers==5.20.2", "safetensors>=0.8"]

[project.optional-dependencies]
nf4 = ["bitsandbytes>=0.49,<1"]
dev = ["ruff>=0.15"]

[project.scripts]
deepinfer = "deepinfer.__main__:main"

[tool.setuptools]
packages = ["deepinfer"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
